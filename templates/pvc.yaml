{{- $volumes := list
  (dict "suffix" "cache" "size" "5Gi" "storageClass" .Values.persistence.cache.storageClass)
  (dict "suffix" "download" "size" "20Gi" "storageClass" .Values.persistence.download.storageClass)
  (dict "suffix" "redis" "size" .Values.redis.persistence.size "storageClass" .Values.redis.persistence.storageClass) }}
{{- range $volumes }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "tubearchivist.fullname" $ }}-{{ .suffix }}
  labels:
    {{- include "tubearchivist.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ eq .suffix "redis" | ternary "redis" "tubearchivist" }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .size }}
{{- end }}
