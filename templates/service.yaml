apiVersion: v1
kind: Service
metadata:
  name: {{ include "tubearchivist.fullname" . }}
  labels:
    {{- include "tubearchivist.labels" . | nindent 4 }}
    app.kubernetes.io/component: tubearchivist
spec:
  selector:
    {{- include "tubearchivist.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: tubearchivist
  ports:
    - name: http
      port: 8000
      targetPort: http
