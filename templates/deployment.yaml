apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tubearchivist.fullname" . }}
  labels:
    {{- include "tubearchivist.labels" . | nindent 4 }}
    app.kubernetes.io/component: tubearchivist
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tubearchivist.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: tubearchivist
  template:
    metadata:
      labels:
        {{- include "tubearchivist.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: tubearchivist
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tubearchivist
          image: bbilly1/tubearchivist:{{ .Chart.AppVersion }}
          env:
            - name: TA_HOST
              value: https://{{ required "host is required" .Values.host }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: TA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required" .Values.existingSecret }}
                  key: TA_USERNAME
            - name: TA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: TA_PASSWORD
            - name: ES_URL
              value: {{ required "elasticsearch.url is required" .Values.elasticsearch.url | quote }}
            - name: ELASTIC_USER
              value: {{ .Values.elasticsearch.user | quote }}
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: ELASTIC_PASSWORD
            - name: ES_DISABLE_VERIFY_SSL
              value: "true"
            - name: ES_SNAPSHOT_DIR
              value: {{ required "elasticsearch.snapshotDir is required" .Values.elasticsearch.snapshotDir | quote }}
            - name: REDIS_CON
              value: redis://{{ include "tubearchivist.redisName" . }}:6379
            - name: TA_AUTO_UPDATE_YTDLP
              value: release
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /api/health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 30
            timeoutSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: media
              mountPath: /youtube
            - name: cache
              mountPath: /cache
            - name: download
              mountPath: /cache/download
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: {{ required "media.existingClaim is required" .Values.media.existingClaim }}
        - name: cache
          persistentVolumeClaim:
            claimName: {{ include "tubearchivist.fullname" . }}-cache
        - name: download
          persistentVolumeClaim:
            claimName: {{ include "tubearchivist.fullname" . }}-download
