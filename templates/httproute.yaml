{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "tubearchivist.fullname" . }}
  labels:
    {{- include "tubearchivist.labels" . | nindent 4 }}
    app.kubernetes.io/component: tubearchivist
spec:
  parentRefs:
    {{- required "httpRoute.parentRefs is required when httpRoute.enabled is set" .Values.httpRoute.parentRefs | toYaml | nindent 4 }}
  hostnames:
    - {{ required "host is required" .Values.host }}
  rules:
    - backendRefs:
        - name: {{ include "tubearchivist.fullname" . }}
          port: 8000
{{- end }}
