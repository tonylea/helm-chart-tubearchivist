suite: redis
templates:
  - redis.yaml
values:
  - ../ci/test-values.yaml
release:
  name: media
tests:
  - it: runs the pinned Redis image with no resources by default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: redis:8.12.0
      - notExists:
          path: spec.template.spec.containers[0].resources

  - it: sets Redis's resources when given
    documentSelector:
      path: kind
      value: Deployment
    set:
      redis.resources:
        requests:
          cpu: 10m
          memory: 64Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 10m
              memory: 64Mi

  - it: serves Redis on the name REDIS_CON uses
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.name
          value: media-tubearchivist-redis

  - it: runs the exporter beside Redis, pointed at it
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[1].image
          value: oliver006/redis_exporter:v1.99.0
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_ADDR
            value: redis://localhost:6379
      - notExists:
          path: spec.template.spec.containers[1].resources

  - it: sets the exporter's resources when given
    documentSelector:
      path: kind
      value: Deployment
    set:
      redis.exporter.resources:
        requests:
          cpu: 10m
          memory: 32Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[1].resources
          value:
            requests:
              cpu: 10m
              memory: 32Mi

  - it: serves the exporter's metrics port
    documentSelector:
      path: kind
      value: Service
    asserts:
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 9121
            targetPort: metrics
