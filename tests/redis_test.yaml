suite: redis
templates:
  - redis.yaml
values:
  - ../ci/test-values.yaml
release:
  name: media
tests:
  - it: runs the pinned Redis image with requests and no limits
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: redis:8.12.0
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 10m
              memory: 64Mi

  - it: serves Redis on the name REDIS_CON uses
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.name
          value: media-tubearchivist-redis
