suite: storage
templates:
  - pvc.yaml
values:
  - ../ci/test-values.yaml
release:
  name: media
tests:
  - it: creates the cache and Redis claims at their default sizes
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi
        documentIndex: 0
      - equal:
          path: spec.resources.requests.storage
          value: 128Mi
        documentIndex: 1

  - it: leaves the storage class to the cluster default when unset
    asserts:
      - notExists:
          path: spec.storageClassName

  - it: sets each size and storage class when given
    set:
      persistence.cache.size: 10Gi
      persistence.cache.storageClass: fast
      redis.persistence.size: 256Mi
      redis.persistence.storageClass: fast
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi
        documentIndex: 0
      - equal:
          path: spec.storageClassName
          value: fast
        documentIndex: 0
      - equal:
          path: spec.resources.requests.storage
          value: 256Mi
        documentIndex: 1
      - equal:
          path: spec.storageClassName
          value: fast
        documentIndex: 1
