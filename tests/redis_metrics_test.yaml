suite: redis metrics
templates:
  - redis-servicemonitor.yaml
  - redis-dashboard.yaml
values:
  - ../ci/test-values.yaml
release:
  name: media
tests:
  - it: renders neither by default
    asserts:
      - hasDocuments:
          count: 0

  - it: scrapes the exporter's port when the ServiceMonitor is on
    template: redis-servicemonitor.yaml
    set:
      redis.serviceMonitor.enabled: true
    asserts:
      - equal:
          path: spec.endpoints[0].port
          value: metrics
      - equal:
          path: spec.endpoints[0].interval
          value: 30s
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: redis

  - it: labels the dashboard for Grafana's sidecar when on
    template: redis-dashboard.yaml
    set:
      redis.dashboard.enabled: true
    asserts:
      - equal:
          path: metadata.labels.grafana_dashboard
          value: "1"
      - exists:
          path: data["redis.json"]
